<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23D97757'/%3E%3Cpath d='M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z' fill='%23FAF9F5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#FAF9F5;            /* ivory paper */
  --panel:#FFFFFF;         /* card */
  --panel-2:#F5F3EC;       /* recessed */
  --ink:#2B2820;           /* warm near-black */
  --soft:#5D584C;
  --muted:#8B8577;
  --faint:#B7B1A2;
  --line:#E8E5DA;
  --line-2:#D9D5C7;
  --accent:#D97757;        /* terracotta */
  --accent-deep:#B4552D;
  --accent-soft:#F9EDE6;
  --green:#748C69; --green-soft:#EFF3EA;
  --amber:#C29A4B; --amber-soft:#F8F1E1;
  --blue:#7C93A6;  --blue-soft:#EDF1F4;
  --danger:#B4452C;
  --radius:14px;
  --shadow-1:0 1px 2px rgba(52,46,30,.05), 0 4px 14px rgba(52,46,30,.05);
  --shadow-2:0 4px 10px rgba(52,46,30,.10), 0 16px 38px rgba(52,46,30,.14);
  --serif:'Lora', Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

/* ============ dark sci-fi theme ============ */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"] body{
  --bg:#031f1f;            /* deep teal-black */
  --panel:#06282a;         /* card, faint lift off bg */
  --panel-2:#061016;       /* recessed / true near-black */
  --ink:#d9f3f0;           /* pale teal-white text */
  --soft:#9fcac4;
  --muted:#5f8f8a;
  --faint:#33605c;
  --line:#0d3a3a;
  --line-2:#134f4c;
  --accent:#4db6b0;        /* signature teal */
  --accent-deep:#3a8f8a;
  --accent-soft:#0a3634;
  --green:#5fd0a8; --green-soft:#07302a;
  --amber:#e0b15c; --amber-soft:#2e2410;
  --blue:#5fa8d0; --blue-soft:#0a2a38;
  --danger:#ef6d63;
  --shadow-1:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.35);
  --shadow-2:0 4px 10px rgba(0,0,0,.45), 0 16px 38px rgba(0,0,0,.55);
  --serif:'Orbitron', 'Lora', Georgia, serif;
}
/* Orbitron is wide/geometric with no italic; tighten negative tracking that
   was tuned for Lora, and keep the quote widget on Lora so its italic style
   still renders correctly. */
html[data-theme="dark"] .dash-title{letter-spacing:.4px}
html[data-theme="dark"] .tm-time,
html[data-theme="dark"] .ct-main,
html[data-theme="dark"] .y27-num,
html[data-theme="dark"] .pm-time{letter-spacing:0}
html[data-theme="dark"] .qt-text{font-family:'Lora', Georgia, serif}
html[data-theme="dark"] body{
  background:
    radial-gradient(1200px 500px at 12% -10%, rgba(77,182,176,.08), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(77,182,176,.05), transparent 55%),
    var(--bg);
}
html[data-theme="dark"] .topbar{background:rgba(3,31,31,.86)}
html[data-theme="dark"] .tray{background:linear-gradient(to bottom, #05201f, #041717)}
html[data-theme="dark"] .logo{box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
html[data-theme="dark"] .btn.primary{color:#04211f}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:var(--line-2)}
html[data-theme="dark"] .canvas > .ghost{background:var(--accent-soft)}
#themeBtn .i-sun{display:none}
#themeBtn .i-moon{display:inline-flex}
html[data-theme="dark"] #themeBtn .i-sun{display:inline-flex}
html[data-theme="dark"] #themeBtn .i-moon{display:none}
*{box-sizing:border-box; margin:0; padding:0}
[hidden]{display:none !important}
html{color-scheme:light}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 14px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

::-webkit-scrollbar{width:9px; height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px; border:2px solid transparent; background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ header ============ */
.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 26px;
  background:rgba(250,249,245,.86); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:13px; min-width:0}
.logo{
  width:38px; height:38px; flex:0 0 auto; border-radius:10px;
  background:var(--accent); color:#FAF9F5;
  display:grid; place-items:center;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
}
.logo svg{width:19px; height:19px}
.dash-title{
  font:600 21px/1.15 var(--serif); letter-spacing:.1px;
  background:transparent; border:0; border-bottom:1px dashed transparent;
  padding:1px 2px; width:min(46vw,380px); border-radius:2px;
}
.dash-title:hover{border-bottom-color:var(--line-2)}
.dash-title:focus{outline:none; border-bottom-color:var(--accent)}
.dash-date{font-size:12px; color:var(--muted); margin-top:1px; padding-left:2px}
.top-actions{display:flex; align-items:center; gap:14px}
.saved{
  font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:5px;
  opacity:0; transform:translateY(2px); transition:opacity .35s, transform .35s;
}
.saved.show{opacity:1; transform:none}
.saved svg{width:13px; height:13px; color:var(--green)}

.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 15px; border-radius:10px;
  font-weight:500; font-size:13.5px; letter-spacing:.1px;
  border:1px solid transparent;
  transition:background .15s, border-color .15s, color .15s, box-shadow .15s, transform .05s;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); color:#FDFBF7; box-shadow:inset 0 -2px 0 rgba(0,0,0,.10)}
.btn.primary:hover{background:var(--accent-deep)}
.btn.ghost{border-color:var(--line-2); color:var(--soft); background:var(--panel)}
.btn.ghost:hover{border-color:var(--faint); color:var(--ink)}
.btn.danger{background:var(--danger); color:#FDFBF7}
.btn.danger:hover{background:#983821}
.btn.sm{padding:6px 12px; font-size:12.5px; border-radius:8px}
.btn svg{width:15px; height:15px}


/* ============ productivity timer ============ */
.tm{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; overflow:hidden}
.tm-state{
  margin-top:auto;
  font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); background:var(--panel-2); padding:3px 10px; border-radius:99px;
}
.tm-state.on{color:#4E6B44; background:var(--green-soft)}
.tm-time{font:600 clamp(24px,3vw,34px)/1 var(--serif); font-variant-numeric:tabular-nums; letter-spacing:-.5px}
.tm-time.on{color:var(--accent-deep)}
.tm .pm-ctl{align-items:center}
.tm-week{width:100%; margin-top:auto; min-height:0; border-top:1px dashed var(--line-2); padding-top:7px; overflow:hidden}
.tm-week-title{font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; display:flex; justify-content:space-between; gap:8px}
.tm-week-title b{color:var(--soft); font-weight:600; letter-spacing:0; text-transform:none; white-space:nowrap}
.tm-days{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px}
.tm-d{display:flex; flex-direction:column; align-items:center; gap:1px; padding:4px 1px; border-radius:7px; background:var(--panel-2); min-width:0}
.tm-d span{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
.tm-d b{font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--soft)}
.tm-d.today{background:var(--accent-soft)}
.tm-d.today b{color:var(--accent-deep)}
.tm-d.zero b{color:var(--faint)}

/* ============ widget tray (customize) ============ */
.tray{
  border-bottom:1px solid var(--line);
  background:linear-gradient(to bottom, #F6F4ED, #F3F1E8);
  padding:16px 26px 18px;
  animation:trayIn .28s cubic-bezier(.2,.7,.3,1);
}
@keyframes trayIn{from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none}}
.tray-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px}
.tray-eyebrow{font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.tray-hint{font-size:12px; color:var(--muted)}
.tray-hint b{color:var(--soft); font-weight:600}
.tray-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:10px}
.tcard{
  display:flex; align-items:flex-start; gap:10px; text-align:left;
  background:var(--panel); border:1px solid var(--line-2); border-radius:12px;
  padding:11px 12px; transition:border-color .15s, box-shadow .15s, transform .1s;
}
.tcard:hover{border-color:var(--accent); box-shadow:var(--shadow-1); transform:translateY(-1px)}
.tcard .ti{
  flex:0 0 auto; width:30px; height:30px; border-radius:8px;
  background:var(--accent-soft); color:var(--accent-deep);
  display:grid; place-items:center;
}
.tcard .ti svg{width:16px; height:16px}
.tcard .tt{min-width:0}
.tcard b{display:block; font-size:13px; font-weight:600; letter-spacing:.1px; color:var(--ink)}
.tcard span{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.35}
.tcard i{display:block; font-style:normal; font-size:10.5px; color:var(--faint); margin-top:4px; letter-spacing:.05em}
.tray-foot{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:12px}
.tray-io{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.tray-check{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--soft); cursor:pointer; user-select:none}
.tray-check input{accent-color:var(--accent)}
.link.io:hover{color:var(--accent-deep); text-decoration-color:var(--accent-deep)}
.link{font-size:12px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line-2)}
.link:hover{color:var(--danger); text-decoration-color:var(--danger)}

/* ============ canvas ============ */
main{padding:22px 26px 60px; overflow-x:auto}
.canvas{position:relative; min-width:880px; margin:0 auto; max-width:1460px}
body[data-mode="edit"] .canvas{
  background-image:radial-gradient(circle, var(--line-2) 1.2px, transparent 1.3px);
  border-radius:8px;
}
.canvas > .ghost{
  position:absolute; z-index:0; border-radius:var(--radius);
  border:1.5px dashed var(--accent); background:var(--accent-soft);
  opacity:.9; transition:left .09s, top .09s, width .09s, height .09s;
  pointer-events:none;
}
.canvas > .ghost.bad{border-color:var(--danger); background:#F6E4DE}

.empty{
  max-width:400px; margin:11vh auto 0; text-align:center; color:var(--muted);
}
.empty .big{font:600 24px/1.3 var(--serif); color:var(--ink); margin-bottom:8px}
.empty p{margin-bottom:18px; font-size:13.5px}

/* ============ widgets ============ */
.widget{
  position:absolute; z-index:1;
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow-1);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.canvas.booted .widget{transition:left .18s cubic-bezier(.2,.7,.3,1), top .18s cubic-bezier(.2,.7,.3,1), width .18s cubic-bezier(.2,.7,.3,1), height .18s cubic-bezier(.2,.7,.3,1), box-shadow .15s, border-color .15s}
.widget.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
body[data-mode="edit"] .widget{cursor:grab}
body[data-mode="edit"] .widget:hover{border-color:var(--faint); box-shadow:var(--shadow-2)}
.widget.dragging{transition:none !important; z-index:50; cursor:grabbing; box-shadow:var(--shadow-2); border-color:var(--accent); opacity:.96}
body.interacting{user-select:none; -webkit-user-select:none}
body[data-mode="edit"] .widget{touch-action:none}

.w-head{
  flex:0 0 auto;
  display:flex; align-items:center; gap:8px;
  padding:11px 14px 0;
}
.w-title{
  font-size:11px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.w-extra{margin-left:auto; font-size:11px; color:var(--faint); white-space:nowrap}
.w-tools{display:none; margin-left:auto; gap:2px}
body[data-mode="edit"] .w-tools{display:flex}
body[data-mode="edit"] .w-extra{display:none}
.w-tools button{
  width:24px; height:24px; border-radius:7px; display:grid; place-items:center;
  color:var(--faint); transition:background .12s, color .12s;
}
.w-tools button:hover{background:var(--panel-2); color:var(--soft)}
.w-tools button.wx:hover{background:#F6E4DE; color:var(--danger)}
.w-tools svg{width:14px; height:14px}
.w-body{flex:1; min-height:0; padding:8px 14px 13px; display:flex; flex-direction:column}
body[data-mode="edit"] .w-body{pointer-events:none}
.w-resize{
  display:none; position:absolute; right:2px; bottom:2px; width:19px; height:19px;
  cursor:nwse-resize; touch-action:none; color:var(--faint);
}
.w-resize:hover{color:var(--accent-deep)}
body[data-mode="edit"] .w-resize{display:block}
.w-resize::after{
  content:""; position:absolute; right:5px; bottom:5px; width:9px; height:9px;
  border-right:2px solid currentColor; border-bottom:2px solid currentColor;
  border-bottom-right-radius:3px;
}

/* small shared bits */
.bar{height:5px; border-radius:99px; background:var(--panel-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s}
.icon-btn{
  width:28px; height:28px; flex:0 0 auto; border-radius:8px; display:grid; place-items:center;
  background:var(--panel-2); color:var(--soft); transition:background .12s, color .12s;
}
.icon-btn:hover{background:var(--accent-soft); color:var(--accent-deep)}
.icon-btn svg{width:14px; height:14px}
.row-x{
  width:20px; height:20px; flex:0 0 auto; border-radius:6px; display:grid; place-items:center;
  color:var(--faint); opacity:0; transition:opacity .12s, background .12s, color .12s;
}
.row-x svg{width:11px; height:11px}
.row-x:hover{background:#F6E4DE; color:var(--danger)}

/* ---- clock ---- */
.clock{flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:4px}
.clock-time{display:flex; align-items:baseline; gap:7px; font-variant-numeric:tabular-nums}
.ct-main{font:600 clamp(30px,4.6vw,44px)/1 var(--serif); letter-spacing:-.5px}
.ct-side{display:flex; flex-direction:column; gap:1px; padding-bottom:3px}
.ct-sec{font:600 14px/1 var(--sans); color:var(--accent-deep); font-variant-numeric:tabular-nums}
.ct-ampm{font:600 10.5px/1 var(--sans); font-style:normal; letter-spacing:.1em; color:var(--muted)}
.clock-date{font-size:12px; color:var(--muted); margin-top:7px}

/* ---- countdown ---- */
.cd{flex:1; display:flex; align-items:center; padding-bottom:2px}
.cd-blocks{flex:1; display:flex; gap:8px}
.cd-b{
  flex:1; background:var(--panel-2); border-radius:10px;
  padding:8px 4px 7px; text-align:center; min-width:0;
}
.cd-b b{display:block; font:600 clamp(19px,2.4vw,27px)/1.1 var(--serif); font-variant-numeric:tabular-nums}
.cd-b span{display:block; font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-top:3px}
.cd-b.hot{background:var(--accent-soft)}
.cd-b.hot b{color:var(--accent-deep)}
.cd-done{flex:1; text-align:center}
.cd-done b{display:block; font:600 24px/1.2 var(--serif); color:var(--accent-deep)}
.cd-done span{font-size:12px; color:var(--muted)}

/* ---- 2027 ---- */
.y27{flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:2px}
.y27-line{display:flex; align-items:baseline; gap:9px}
.y27-num{font:600 clamp(32px,4.6vw,46px)/1 var(--serif); letter-spacing:-.5px; color:var(--accent-deep); font-variant-numeric:tabular-nums}
.y27-sub{font-size:12.5px; color:var(--soft)}
.y27-sub b{font-weight:600; color:var(--ink)}
.y27 .bar{margin-top:10px}
.y27-cap{font-size:11px; color:var(--faint); margin-top:6px; font-variant-numeric:tabular-nums}

/* ---- todo ---- */
.todo{flex:1; display:flex; flex-direction:column; min-height:0}
.todo-add{display:flex; gap:8px; margin-bottom:9px}
.todo-add input{
  flex:1; min-width:0; background:var(--panel-2); border:1px solid transparent; border-radius:9px;
  padding:7px 11px; font-size:13px;
}
.todo-add input:focus{outline:none; border-color:var(--accent); background:var(--panel)}
.todo-list{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:2px; padding-right:2px}
.ti{display:flex; align-items:center; gap:9px; padding:5px 4px; border-radius:8px}
.ti:hover{background:var(--panel-2)}
.ti:hover .row-x{opacity:1}
.tick{
  width:17px; height:17px; flex:0 0 auto; border-radius:6px;
  border:1.5px solid var(--line-2); display:grid; place-items:center; color:transparent;
  transition:background .12s, border-color .12s, color .12s;
}
.tick svg{width:10px; height:10px}
.ti .tx{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ti.done .tick{background:var(--green); border-color:var(--green); color:#fff}
.ti.done .tx{color:var(--faint); text-decoration:line-through; text-decoration-color:var(--line-2)}
.todo-foot{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding-top:8px; margin-top:4px; border-top:1px solid var(--line)}
.todo-foot .cnt{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.mini-empty{font-size:12px; color:var(--faint); padding:8px 4px}

/* ---- note ---- */
.note{
  flex:1; resize:none; border:0; background:
    repeating-linear-gradient(to bottom, transparent, transparent 25px, var(--line) 25px, var(--line) 26px);
  line-height:26px; font-size:13.5px; padding:0 2px; color:var(--soft);
}
.note:focus{outline:none; color:var(--ink)}
.note::placeholder{color:var(--faint)}

/* ---- priority matrix ---- */
.mx{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:9px}
.mq{
  min-height:0; display:flex; flex-direction:column;
  background:var(--panel-2); border-radius:10px; padding:8px 9px 7px;
}
.mq-h{display:flex; align-items:center; gap:6px; margin-bottom:5px}
.mq-h .dot{width:7px; height:7px; border-radius:99px; flex:0 0 auto}
.mq-h b{font-size:11px; font-weight:600; letter-spacing:.02em}
.mq-h span{font-size:9.5px; color:var(--faint); margin-left:auto; white-space:nowrap}
.mq.q1 .dot{background:var(--accent)} .mq.q1{background:var(--accent-soft)}
.mq.q2 .dot{background:var(--green)}  .mq.q2{background:var(--green-soft)}
.mq.q3 .dot{background:var(--amber)}  .mq.q3{background:var(--amber-soft)}
.mq.q4 .dot{background:var(--blue)}   .mq.q4{background:var(--blue-soft)}
.mq-list{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:1px}
.mi{display:flex; align-items:center; gap:6px; font-size:12px; padding:2.5px 3px; border-radius:6px; cursor:pointer}
.mi:hover{background:rgba(255,255,255,.65)}
.mi:hover .row-x{opacity:1}
.mi .tx{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mi.done .tx{color:var(--faint); text-decoration:line-through}
.mq-add{
  flex:0 0 auto; margin-top:4px; border:0; background:transparent; font-size:11.5px;
  padding:3px 3px; border-top:1px dashed transparent; color:var(--soft);
}
.mq-add::placeholder{color:var(--faint)}
.mq-add:focus{outline:none; border-top-color:var(--line-2)}

/* ---- pomodoro ---- */
.pomo{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center}
.pm-mode{
  font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent-deep); background:var(--accent-soft); padding:3px 10px; border-radius:99px;
}
.pm-mode.break{color:#4E6B44; background:var(--green-soft)}
.pm-time{font:600 clamp(30px,3.4vw,40px)/1 var(--serif); font-variant-numeric:tabular-nums; letter-spacing:-.5px}
.pomo .bar{width:72%; height:4px}
.pm-ctl{display:flex; gap:8px; margin-top:2px}
.pm-dots{display:flex; gap:5px; min-height:7px}
.pm-dots i{width:6px; height:6px; border-radius:99px; background:var(--accent)}

/* ---- schedule ---- */
.sch{flex:1; display:flex; flex-direction:column; min-height:0}
.sch-list{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column}
.sr{display:flex; align-items:center; gap:10px; padding:6px 4px; border-bottom:1px dashed var(--line)}
.sr:last-child{border-bottom:0}
.sr:hover .row-x{opacity:1}
.sr .st{
  flex:0 0 auto; width:64px; font-size:11.5px; font-weight:600; color:var(--accent-deep);
  font-variant-numeric:tabular-nums;
}
.sr .sl{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sr.past .st{color:var(--faint)}
.sr.past .sl{color:var(--faint); text-decoration:line-through; text-decoration-color:var(--line-2)}
.inline-add{display:flex; gap:7px; padding-top:9px; margin-top:5px; border-top:1px solid var(--line)}
.inline-add input{
  min-width:0; background:var(--panel-2); border:1px solid transparent; border-radius:8px;
  padding:5.5px 9px; font-size:12px;
}
.inline-add input:focus{outline:none; border-color:var(--accent); background:var(--panel)}
.inline-add .grow{flex:1}
.inline-add input[type="time"]{flex:0 0 96px; color:var(--soft)}

/* ---- quick links ---- */
.lk{flex:1; display:flex; flex-direction:column; min-height:0}
.lk-list{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:2px}
.li{display:flex; align-items:center; gap:9px; padding:5px 5px; border-radius:8px; cursor:pointer}
.li:hover{background:var(--panel-2)}
.li:hover .row-x{opacity:1}
.li .mono{
  width:24px; height:24px; flex:0 0 auto; border-radius:7px;
  background:var(--accent-soft); color:var(--accent-deep);
  font:600 11px/1 var(--sans); display:grid; place-items:center; text-transform:uppercase;
}
.li .tx{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.li .arr{color:var(--faint); font-size:11px}

/* ---- dailies ---- */
.dl{flex:1; display:flex; flex-direction:column; min-height:0}
.dl-list{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:2px; padding-right:2px}
.streak{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:3px;
  font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums;
  color:var(--faint); background:var(--panel-2); border-radius:99px; padding:2.5px 8px 2.5px 5px;
  transition:background .15s, color .15s;
}
.streak svg{width:11px; height:11px}
.streak.on{color:var(--accent-deep); background:var(--accent-soft)}
.streak.hot{color:#FAF9F5; background:var(--accent)}
.ti.done .streak{opacity:.85}
.dl-best{font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}

/* ---- deadlines ---- */
.badge{
  flex:0 0 auto; font-size:10px; font-weight:600; letter-spacing:.03em;
  padding:2.5px 8px; border-radius:99px; background:var(--panel-2); color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.badge.soon{background:var(--amber-soft); color:#8A6A24}
.badge.today{background:var(--accent-soft); color:var(--accent-deep)}
.badge.over{background:#F6E4DE; color:var(--danger)}

/* ---- calendar ---- */
.cal{flex:1; display:flex; flex-direction:column; min-height:0}
.cal-head{flex:0 0 auto; display:flex; align-items:center; gap:4px; margin-bottom:5px}
.cal-title{flex:1; text-align:center; font:600 13.5px/1 var(--serif); border-radius:7px; padding:5px 0}
.cal-title:hover{background:var(--panel-2)}
.nav-b{width:24px; height:24px; flex:0 0 auto; border-radius:7px; display:grid; place-items:center; color:var(--muted); transition:background .12s, color .12s}
.nav-b:hover{background:var(--panel-2); color:var(--ink)}
.nav-b svg{width:13px; height:13px}
.cal-dow{flex:0 0 auto; display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:2px}
.cal-dow span{text-align:center; font-size:9.5px; font-weight:600; letter-spacing:.08em; color:var(--faint)}
.cal-grid{flex:1; min-height:0; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; gap:1px}
.cal-d{
  position:relative; border-radius:8px; min-height:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  font-size:12px; font-variant-numeric:tabular-nums; color:var(--soft);
  transition:background .12s;
}
.cal-d:hover{background:var(--panel-2)}
.cal-d.out{color:var(--faint); opacity:.5}
.cal-d.today{font-weight:600; color:var(--accent-deep); box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-d.sel{background:var(--accent); color:#FAF9F5; box-shadow:none; font-weight:600}
.cal-dots{display:flex; gap:2px; height:4px}
.cal-dots i{width:4px; height:4px; border-radius:99px; background:var(--accent)}
.cal-dots i.dl{background:var(--amber)}
.cal-d.sel .cal-dots i{background:#FAF9F5}
.cal-sel{flex:0 0 auto; max-height:38%; overflow-y:auto; border-top:1px solid var(--line); margin-top:6px; padding-top:6px}
.cal-sel-day{font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.cse{display:flex; align-items:center; gap:7px; font-size:12px; padding:2.5px 2px; min-width:0}
.cse i{width:5px; height:5px; border-radius:99px; background:var(--accent); flex:0 0 auto}
.cse.dl{flex:0 0 auto; flex-direction:row; align-items:center; min-height:auto}
.cse.dl i{background:var(--amber)}
.cse .t{flex:0 0 auto; color:var(--accent-deep); font-weight:600; font-size:11px; font-variant-numeric:tabular-nums}
.cse.dl .t{color:#8A6A24}
.cse .x{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cal-add{display:flex; gap:6px; margin-top:5px}
.cal-add input{
  min-width:0; background:var(--panel-2); border:1px solid transparent; border-radius:8px;
  padding:4.5px 8px; font-size:11.5px;
}
.cal-add input:focus{outline:none; border-color:var(--accent); background:var(--panel)}
.cal-add input[type="time"]{flex:0 0 84px; color:var(--soft)}
.cal-add .grow{flex:1}
.cal-add .icon-btn{width:26px; height:26px}
.cal-hint{font-size:11px; color:var(--faint); margin-top:4px}

/* ---- quote ---- */
.qt{flex:1; display:flex; flex-direction:column; justify-content:center; gap:8px; padding-bottom:2px; min-height:0}
.qt-text{font:500 clamp(13.5px,1.5vw,16px)/1.45 var(--serif); font-style:italic; overflow:hidden}
.qt-by{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted)}

/* ---- schedule day navigation ---- */
.sch-nav{flex:0 0 auto; display:flex; align-items:center; gap:4px; margin-bottom:3px}
.sch-day{flex:1; text-align:center; font-size:12px; font-weight:600; border-radius:7px; padding:4px 0}
.sch-day:hover{background:var(--panel-2)}
.sch-day.away{color:var(--accent-deep)}
.sr .rep{flex:0 0 auto; color:var(--faint); display:grid; place-items:center}
.sr .rep svg{width:11px; height:11px}
.inline-add input[type="date"]{flex:0 0 112px; color:var(--soft); font-size:11px}
.sch .inline-add input[type="time"]{flex:0 0 82px}

/* ============ modal ============ */
.scrim{
  position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:20px;
  background:rgba(43,40,32,.32); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  animation:fadeIn .16s;
}
@keyframes fadeIn{from{opacity:0}}
.modal{
  width:min(440px,100%); background:var(--panel); border-radius:16px;
  border:1px solid var(--line); box-shadow:var(--shadow-2);
  padding:20px 22px 18px; animation:modalIn .2s cubic-bezier(.2,.8,.3,1.1);
}
@keyframes modalIn{from{opacity:0; transform:scale(.96) translateY(6px)}}
.modal h3{font:600 17px/1.3 var(--serif); margin-bottom:2px}
.modal .sub{font-size:12.5px; color:var(--muted); margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.field input[type="text"],.field input[type="number"],.field input[type="datetime-local"],.field select{
  width:100%; background:var(--panel-2); border:1px solid var(--line-2); border-radius:9px;
  padding:8px 11px; font-size:13.5px;
}
.field input:focus,.field select:focus{outline:none; border-color:var(--accent); background:var(--panel)}
.field.check{display:flex; align-items:center; gap:9px}
.field.check label{margin:0; text-transform:none; letter-spacing:0; font-size:13px; font-weight:500; color:var(--ink)}
.field.check input{width:15px; height:15px; accent-color:var(--accent)}
.modal-actions{display:flex; justify-content:flex-end; gap:9px; margin-top:18px}

/* ============ responsive: stacked view on small screens ============ */
@media (max-width:720px){
  .topbar{padding:12px 16px}
  main{padding:14px 14px 40px}
  #modeBtn, .tray{display:none !important}
  .canvas{min-width:0; display:flex; flex-direction:column; gap:12px; height:auto !important; background-image:none !important}
  .widget{position:static !important; width:auto !important; height:auto !important}
  .widget[data-type="todo"] .w-body,.widget[data-type="matrix"] .w-body{min-height:250px}
  .widget[data-type="note"] .w-body{min-height:170px}
  .widget[data-type="schedule"] .w-body,.widget[data-type="links"] .w-body{min-height:160px}
  .widget[data-type="clock"] .w-body,.widget[data-type="countdown"] .w-body,.widget[data-type="y2027"] .w-body,.widget[data-type="pomo"] .w-body,.widget[data-type="quote"] .w-body{min-height:104px}
  .widget[data-type="dailies"] .w-body,.widget[data-type="deadlines"] .w-body{min-height:210px}
  .widget[data-type="timer"] .w-body{min-height:190px}
  .widget[data-type="calendar"] .w-body{min-height:360px}
  .dash-title{width:52vw}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>

</div>

<script>

   Student Dashboard — single-file app
   Modes: view (default) & customize. 12-col snap grid.

'use strict';

/* ---------- tiny helpers ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad2 = n => String(n).padStart(2, '0');
const uid = () => 'w' + Math.random().toString(36).slice(2, 9);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function fmtTime12(hhmm) {                 // "14:30" -> "2:30 PM"
  const [h, m] = hhmm.split(':').map(Number);
  if (isNaN(h)) return hhmm;
  const ap = h >= 12 ? 'PM' : 'AM';
  return `${((h + 11) % 12) + 1}:${pad2(m)} ${ap}`;
}
function toLocalInput(d) {                 // Date -> "YYYY-MM-DDTHH:mm"
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtTargetShort(d) {
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' +
         d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function dayKey(d) {                       // Date -> "YYYY-MM-DD" (local)
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function fromKey(k) {                      // "YYYY-MM-DD" -> local Date at midnight
  const [y, m, dd] = k.split('-').map(Number);
  return new Date(y, m - 1, dd);
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((fromKey(b) - fromKey(a)) / 86400000); }
function fmtDayLabel(k) {
  const today = dayKey(new Date());
  if (k === today) return 'Today';
  if (k === dayKey(addDays(new Date(), 1))) return 'Tomorrow';
  if (k === dayKey(addDays(new Date(), -1))) return 'Yesterday';
  return fromKey(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

/* ---------- icons ---------- */
const I = (paths, extra='') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${paths}</svg>`;

  countdown:I('<path d="M7 3.5h10M7 20.5h10M8.2 3.5v2.6c0 2.9 3.8 3.4 3.8 5.9s-3.8 3-3.8 5.9v2.6M15.8 3.5v2.6c0 2.9-3.8 3.4-3.8 5.9s3.8 3 3.8 5.9v2.6"/>'),

  schedule: I('<rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8.5 3.5v3.5M15.5 3.5v3.5"/><path d="M8 14h3M8 17h5"/>'),
  links:    I('<path d="M10.5 13.5a4 4 0 0 0 6 .4l2.3-2.3a4 4 0 1 0-5.7-5.7l-1.3 1.3"/><path d="M13.5 10.5a4 4 0 0 0-6-.4l-2.3 2.3a4 4 0 1 0 5.7 5.7l1.3-1.3"/>'),

  quote:    I('<path d="M9.8 7.2C7.3 8.3 6 10.3 6 13v3.8h4.8V12H8.2c.2-1.5 1-2.6 2.4-3.3z"/><path d="M19 7.2c-2.5 1.1-3.8 3.1-3.8 5.8v3.8H20V12h-2.6c.2-1.5 1-2.6 2.4-3.3z"/>'),

  repeat:   I('<path d="M4.8 9.2a7 7 0 0 1 12-2.4L18.8 9M18.8 4.2V9h-4.6M19.2 14.8a7 7 0 0 1-12 2.4L5.2 15M5.2 19.8V15h4.6"/>'),
};

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const memStore = {};
const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return memStore[k] ?? null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } },
};
const LS_KEY = 'student-dashboard.v1';
const THEME_KEY = 'student-dashboard.theme';

/* ---------- theme (light / dark sci-fi) ---------- */
function applyTheme(t) {
  if (t === 'dark') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;

/* ---------- layout ---------- */
function computeCell() {
  cellW = (canvas.clientWidth - GAP * (COLS - 1)) / COLS;
}
function neededRows() {
  return Math.max(8, ...state.widgets.map(w => w.y + w.h));
}
function setCanvasHeight(minRows = 0) {
  const rows = Math.max(neededRows() + (mode === 'edit' ? 3 : 0), minRows);
  canvas.style.height = (rows * (ROW + GAP) - GAP) + 'px';
  canvas.style.backgroundSize = `${cellW + GAP}px ${ROW + GAP}px`;
  canvas.style.backgroundPosition = `${(cellW + GAP) - GAP / 2 - 1}px ${(ROW + GAP) - GAP / 2 - 1}px`;
}
function positionEl(node, w) {
  node.style.left = pxX(w.x) + 'px';
  node.style.top = pxY(w.y) + 'px';
  node.style.width = pxW(w.w) + 'px';
  node.style.height = pxH(w.h) + 'px';
  node.style.order = w.y * 100 + w.x;   // used by the stacked mobile layout
}
function layoutAll() {
  computeCell();
  state.widgets.forEach(w => { const m = mounted.get(w.id); if (m) positionEl(m.el, w); });
  setCanvasHeight();
}

function collides(id, gx, gy, gw, gh) {
  return state.widgets.some(o =>
    o.id !== id &&
    gx < o.x + o.w && gx + gw > o.x &&
    gy < o.y + o.h && gy + gh > o.y
  );
}
function autoPlace(gw, gh) {
  for (let y = 0; y < 120; y++)
    for (let x = 0; x <= COLS - gw; x++)
      if (!collides(null, x, y, gw, gh)) return { x, y };
  return { x: 0, y: neededRows() };
}

/* ---------- ghost ---------- */
function showGhost(x, y, w, h, ok) {
  ghost.hidden = false;
  ghost.classList.toggle('bad', !ok);
  ghost.style.left = pxX(x) + 'px';
  ghost.style.top = pxY(y) + 'px';
  ghost.style.width = pxW(w) + 'px';
  ghost.style.height = pxH(h) + 'px';
}
function hideGhost(){ ghost.hidden = true; }

/* Find the closest non-colliding grid spot to (gx, gy) so drops "give" instead of refusing. */
function nearestFree(id, gx, gy, gw, gh) {
  if (!collides(id, gx, gy, gw, gh)) return { x: gx, y: gy };
  let best = null, bestD = Infinity;
  const R = 8;                                    // search radius in cells
  for (let dy = -R; dy <= R; dy++) {
    const ny = gy + dy;
    if (ny < 0) continue;
    for (let dx = -R; dx <= R; dx++) {
      const nx = gx + dx;
      if (nx < 0 || nx > COLS - gw) continue;
      const d = dx * dx + dy * dy;
      if (d >= bestD) continue;
      if (!collides(id, nx, ny, gw, gh)) { bestD = d; best = { x: nx, y: ny }; }
    }
  }
  return best;
}

/* ---------- drag & resize ---------- */
function startDrag(e, w, node) {
  if (mode !== 'edit' || e.button === 2) return;
  if (e.target.closest('.w-tools') || e.target.closest('.w-resize')) return;
  e.preventDefault();
  const start = { mx: e.clientX, my: e.clientY, left: pxX(w.x), top: pxY(w.y) };
  let target = { x: w.x, y: w.y, ok: true };
  node.classList.add('dragging');
  document.body.classList.add('interacting');
  showGhost(w.x, w.y, w.w, w.h, true);

  const move = ev => {
    const dx = ev.clientX - start.mx, dy = ev.clientY - start.my;
    node.style.left = (start.left + dx) + 'px';
    node.style.top = Math.max(-6, start.top + dy) + 'px';
    const gx = clamp(Math.round((start.left + dx) / (cellW + GAP)), 0, COLS - w.w);
    const gy = Math.max(0, Math.round((start.top + dy) / (ROW + GAP)));
    const snap = nearestFree(w.id, gx, gy, w.w, w.h);   // nudge to closest open spot
    if (snap) target = { x: snap.x, y: snap.y, ok: true };
    else target = { ...target, ok: false };             // keep last good spot as fallback
    showGhost(snap ? snap.x : gx, snap ? snap.y : gy, w.w, w.h, !!snap);
    setCanvasHeight((snap ? snap.y : gy) + w.h + 2);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointercancel', up);
    hideGhost();
    node.classList.remove('dragging');
    document.body.classList.remove('interacting');
    w.x = target.x; w.y = target.y;                     // last valid spot — never a full revert
    positionEl(node, w);
    setCanvasHeight();
    saveState();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up, { once: true });
  window.addEventListener('pointercancel', up);
}

function startResize(e, w, node) {
  if (mode !== 'edit') return;
  e.preventDefault();
  e.stopPropagation();
  const t = TYPES[w.type];
  const start = { mx: e.clientX, my: e.clientY, pw: pxW(w.w), ph: pxH(w.h) };
  let target = { w: w.w, h: w.h, ok: true };
  node.classList.add('dragging');
  document.body.classList.add('interacting');
  showGhost(w.x, w.y, w.w, w.h, true);

  const move = ev => {
    const nw = Math.max(40, start.pw + (ev.clientX - start.mx));
    const nh = Math.max(40, start.ph + (ev.clientY - start.my));
    node.style.width = nw + 'px';
    node.style.height = nh + 'px';
    const gw = clamp(Math.round((nw + GAP) / (cellW + GAP)), t.minW, COLS - w.x);
    const gh = Math.max(t.minH, Math.round((nh + GAP) / (ROW + GAP)));
    if (!collides(w.id, w.x, w.y, gw, gh)) target = { w: gw, h: gh, ok: true };
    else target = { ...target, ok: false };             // hold the last size that fit
    showGhost(w.x, w.y, target.w, target.h, target.ok);
    setCanvasHeight(w.y + target.h + 2);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointercancel', up);
    hideGhost();
    node.classList.remove('dragging');
    document.body.classList.remove('interacting');
    w.w = target.w; w.h = target.h;                     // last size that fit — never a full revert
    positionEl(node, w);
    setCanvasHeight();
    saveState();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up, { once: true });
  window.addEventListener('pointercancel', up);
}

/* ---------- widget shell ---------- */
function createWidget(w) {
  const t = TYPES[w.type];
  const node = el('section', 'widget');
  node.dataset.id = w.id;
  node.dataset.type = w.type;

  const head = el('div', 'w-head');
  const title = el('span', 'w-title', w.title || t.label);
  const extra = el('span', 'w-extra');
  const tools = el('div', 'w-tools');
  const gearBtn = el('button', 'wg'); gearBtn.innerHTML = ICONS.gear; gearBtn.title = 'Widget settings'; gearBtn.setAttribute('aria-label', 'Widget settings');
  const delBtn = el('button', 'wx'); delBtn.innerHTML = ICONS.x; delBtn.title = 'Remove widget'; delBtn.setAttribute('aria-label', 'Remove widget');
  tools.append(gearBtn, delBtn);
  head.append(title, extra, tools);

  const body = el('div', 'w-body');
  const grip = el('div', 'w-resize');

  node.append(head, body, grip);
  canvas.appendChild(node);
  mounted.set(w.id, { el: node, body, title, extra });

  positionEl(node, w);
  t.render(body, w);

  node.addEventListener('pointerdown', e => startDrag(e, w, node));
  grip.addEventListener('pointerdown', e => startResize(e, w, node));
  gearBtn.addEventListener('pointerdown', e => e.stopPropagation());
  delBtn.addEventListener('pointerdown', e => e.stopPropagation());
  gearBtn.addEventListener('click', () => openSettings(w));
  delBtn.addEventListener('click', () => requestDelete(w));
  return node;
}

function refreshWidget(w) {
  const m = mounted.get(w.id);
  if (!m) return;
  m.title.textContent = w.title || TYPES[w.type].label;
  m.body.innerHTML = '';
  TYPES[w.type].render(m.body, w);
}

function syncCalendars() {
  state.widgets.forEach(w => { if (w.type === 'calendar') refreshWidget(w); });
}

function renderAll() {
  mounted.clear();
  canvas.innerHTML = '';
  canvas.appendChild(ghost);
  computeCell();
  state.widgets.forEach(createWidget);
  setCanvasHeight();
  $('#emptyState').hidden = state.widgets.length > 0 || mode === 'edit';
  canvas.classList.remove('booted');
  requestAnimationFrame(() => requestAnimationFrame(() => canvas.classList.add('booted')));
}

function addWidget(type) {
  const t = TYPES[type];
  const spot = autoPlace(t.defW, t.defH);
  const w = { id: uid(), type, title: t.label, x: spot.x, y: spot.y, w: t.defW, h: t.defH, data: t.defData() };
  state.widgets.push(w);
  const node = createWidget(w);
  node.classList.add('pop');
  setTimeout(() => node.classList.remove('pop'), 400);
  setCanvasHeight();
  $('#emptyState').hidden = true;
  node.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  saveState();
}

function removeWidget(w) {
  state.widgets = state.widgets.filter(x => x.id !== w.id);
  const m = mounted.get(w.id);
  if (m) { m.el.remove(); mounted.delete(w.id); }
  setCanvasHeight();
  $('#emptyState').hidden = state.widgets.length > 0 || mode === 'edit';
  saveState();
}

function widgetHasContent(w) {
  const d = w.data || {};
  if (w.type === 'note') return !!(d.text && d.text.trim());
  if (['todo', 'schedule', 'links', 'dailies', 'deadlines'].includes(w.type)) return (d.items || []).length > 0;
  if (w.type === 'timer') return !!d.startedAt || Object.values(d.log || {}).some(v => v > 0);
  if (w.type === 'matrix') return ['q1','q2','q3','q4'].some(k => (d[k] || []).length > 0);
  return false;
}
function requestDelete(w) {
  if (!widgetHasContent(w)) { removeWidget(w); return; }
  openModal({
    title: 'Remove this widget?',
    sub: `“${w.title || TYPES[w.type].label}” has content that will be lost.`,
    actions: [
      { label: 'Cancel', cls: 'ghost' },
      { label: 'Remove', cls: 'danger', fn: () => removeWidget(w) },
    ],
  });
}


/* ---------- confirm before deleting small items (toggle in customize) ---------- */
function confirmRowDelete(what, name, fn) {
  if (state && state.confirmDeletes === false) { fn(); return; }
  openModal({
    title: `Delete this ${what}?`,
    sub: name ? `\u201c${String(name).slice(0, 80)}\u201d will be removed. This can\u2019t be undone.` : 'This can\u2019t be undone.',
    actions: [
      { label: 'Cancel', cls: 'ghost' },
      { label: 'Delete', cls: 'danger', fn },
    ],
  });
}
/* ---------- generic list row (todo / matrix items) ---------- */
function makeCheckRow(item, { onToggle, onDelete, mini }) {
  const row = el('div', mini ? 'mi' : 'ti');
  if (item.d) row.classList.add('done');
  if (!mini) {
    const tick = el('button', 'tick'); tick.innerHTML = ICONS.check; tick.setAttribute('aria-label', 'Toggle done');
    tick.addEventListener('click', onToggle);
    row.appendChild(tick);
  } else {
    row.addEventListener('click', e => { if (!e.target.closest('.row-x')) onToggle(); });
  }
  row.appendChild(el('span', 'tx', item.t));
  const x = el('button', 'row-x'); x.innerHTML = ICONS.x; x.setAttribute('aria-label', 'Delete item');
  x.addEventListener('click', e => { e.stopPropagation(); confirmRowDelete('task', item.t, onDelete); });
  row.appendChild(x);
  return row;
}

    label: 'Countdown', desc: 'Days · hrs · min · sec until a date you pick.',

      const blocks = body.querySelector('.cd-blocks');

    icon: ICONS.todo, defW: 4, defH: 5, minW: 2, minH: 2,

    render(body, w) {
      body.innerHTML = `
        <div class="todo">
          <div class="todo-add">

        </div>`;
      const input = body.querySelector('input');
      const add = () => {
        const t = input.value.trim();
        if (!t) return;
        w.data.items.push({ t, d: false });
        input.value = '';
        drawList(); saveState(); input.focus();
      };
      body.querySelector('.icon-btn').addEventListener('click', add);

      body.querySelector('.clear').addEventListener('click', () => {
        w.data.items = w.data.items.filter(i => !i.d);

        list.innerHTML = '';

        w.data.items.forEach((item, idx) => {

  /* ---- productivity timer ---- */
  timer: {
    label: 'Timer', desc: 'Continuous productivity stopwatch with weekly hours.',
    icon: ICONS.stopwatch, defW: 4, defH: 3, minW: 2, minH: 2,
    defData: () => ({ log: {}, startedAt: null, last: null }),
    weekKeys() {                                   // Mon..Sun of the current week
      const n = new Date();
      const mon = addDays(n, -((n.getDay() + 6) % 7));
      return Array.from({ length: 7 }, (_, i) => dayKey(addDays(mon, i)));
    },
    prune(w) {                                     // keep the log from growing forever
      const keep = dayKey(addDays(new Date(), -14));
      Object.keys(w.data.log || {}).forEach(k => { if (k < keep) delete w.data.log[k]; });
    },
    render(body, w) {
      w.data.log = w.data.log || {};
      this.prune(w);
      if (w.data.startedAt && w.data.last) this.credit(w);   // resume after reload — credit time that passed while the tab was closed
      else if (w.data.startedAt) w.data.last = Date.now();
      body.innerHTML = `
        <div class="tm">
          <span class="tm-state"></span>
          <div class="tm-time">00:00:00</div>
          <div class="pm-ctl">
            <button class="btn primary sm start">Start</button>
            <button class="link zero" title="Reset the current session clock">Reset</button>
          </div>
          <div class="tm-week">
            <div class="tm-week-title"><span>This week</span><b class="tm-total"></b></div>
            <div class="tm-days"></div>
          </div>
        </div>`;
      const startBtn = body.querySelector('.start');
      startBtn.addEventListener('click', () => {
        if (w.data.startedAt) {                       // stop
          this.credit(w);
          w.data.startedAt = null; w.data.last = null;
        } else {                                      // start
          w.data.startedAt = Date.now(); w.data.last = Date.now();
        }
        saveState();
        this.paint(body, w);
      });
      body.querySelector('.zero').addEventListener('click', () => {
        if (w.data.startedAt) { w.data.startedAt = Date.now(); w.data.last = Date.now(); }
        saveState();
        this.paint(body, w);
      });
      this.paint(body, w);
    },
    credit(w) {                                       // add elapsed-since-last-mark to the log, split across days
      if (!w.data.last) return;
      const now = Date.now();
      let from = w.data.last;
      while (from < now) {
        const d = new Date(from);
        const nextMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
        const upto = Math.min(now, nextMidnight);
        const sec = Math.round((upto - from) / 1000);
        if (sec > 0) {
          const k = dayKey(new Date(from));
          w.data.log[k] = (w.data.log[k] || 0) + sec;
        }
        from = upto;
      }
      w.data.last = now;
    },
    paint(body, w) {
      const on = !!w.data.startedAt;
      const st = body.querySelector('.tm-state');
      st.textContent = on ? 'Running' : 'Stopped';
      st.classList.toggle('on', on);
      const tEl = body.querySelector('.tm-time');
      tEl.classList.toggle('on', on);
      const sec = on ? Math.floor((Date.now() - w.data.startedAt) / 1000) : 0;
      tEl.textContent = `${pad2(Math.floor(sec / 3600))}:${pad2(Math.floor(sec / 60) % 60)}:${pad2(sec % 60)}`;
      body.querySelector('.start').textContent = on ? 'Stop' : 'Start';
      /* week table */
      const days = body.querySelector('.tm-days');
      days.innerHTML = '';
      const today = dayKey(new Date());
      let total = 0;
      this.weekKeys().forEach(k => {
        const s = (w.data.log[k] || 0) + (on && k === today ? Math.round((Date.now() - w.data.last) / 1000) : 0);
        total += s;
        const h = s / 3600;
        const d = el('div', 'tm-d' + (k === today ? ' today' : '') + (s === 0 ? ' zero' : ''));
        d.append(el('span', null, fromKey(k).toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2)),
                 el('b', null, h ? (h >= 10 ? h.toFixed(0) : h.toFixed(1)) : '0'));
        d.title = `${fmtDayLabel(k)} — ${(s / 3600).toFixed(2)} h`;
        days.appendChild(d);
      });
      body.querySelector('.tm-total').textContent = (total / 3600).toFixed(1) + ' h total';
      const m = mounted.get(w.id);
      if (m) m.extra.textContent = on ? 'timing…' : '';
    },
    tick(body, w) {
      if (!w.data.startedAt) return;
      this.credit(w);                                 // rolls into the right day across midnight
      saveState();
      this.paint(body, w);
    },
  },

          const addRow = el('div', 'cal-add');
          const timeIn = el('input'); timeIn.type = 'time'; timeIn.setAttribute('aria-label', 'Event time');
          const textIn = el('input', 'grow'); textIn.type = 'text'; textIn.placeholder = 'Add on this day…'; textIn.maxLength = 90;
          textIn.setAttribute('aria-label', 'Event name');
          const btn = el('button', 'icon-btn'); btn.innerHTML = ICONS.plus; btn.setAttribute('aria-label', 'Add event');
          const add = () => {
            const t = textIn.value.trim();
            if (!t) return;
            (sched.data.items = sched.data.items || []).push({ date: r.sel, time: timeIn.value || '', label: t });
            saveState(); refreshWidget(sched); drawAll();
          };
          btn.addEventListener('click', add);
          textIn.addEventListener('keydown', ev => { if (ev.key === 'Enter') add(); });
          addRow.append(timeIn, textIn, btn);
          selBox.appendChild(addRow);
        } else {
          selBox.appendChild(el('div', 'cal-hint', 'Add a Schedule widget to plan events from here.'));
        }
      };

      const drawGrid = () => {
        title.textContent = new Date(r.y, r.m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        grid.innerHTML = '';
        const map = this.gather();
        const today = dayKey(new Date());
        const first = new Date(r.y, r.m, 1);
        const start = addDays(first, -first.getDay());
        const weeks = Math.ceil((first.getDay() + new Date(r.y, r.m + 1, 0).getDate()) / 7);
        for (let i = 0; i < weeks * 7; i++) {
          const d = addDays(start, i);
          const k = dayKey(d);
          const cell = el('button', 'cal-d');
          if (d.getMonth() !== r.m) cell.classList.add('out');
          if (k === today) cell.classList.add('today');
          if (k === r.sel) cell.classList.add('sel');
          cell.appendChild(el('span', null, d.getDate()));
          const dots = el('span', 'cal-dots');
          const day = map[k];
          if (day) {
            if (day.ev.length) dots.appendChild(el('i'));
            if (day.dl.length) dots.appendChild(el('i', 'dl'));
          }
          cell.appendChild(dots);
          cell.setAttribute('aria-label', d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }));
          cell.addEventListener('click', () => { r.sel = k; r.y = d.getFullYear(); r.m = d.getMonth(); drawAll(); });
          grid.appendChild(cell);
        }
      };
      const drawAll = () => { drawGrid(); drawSel(); };
      body.querySelector('.prev').addEventListener('click', () => { r.m--; if (r.m < 0) { r.m = 11; r.y--; } drawAll(); });
      body.querySelector('.next').addEventListener('click', () => { r.m++; if (r.m > 11) { r.m = 0; r.y++; } drawAll(); });
      title.addEventListener('click', () => { const n = new Date(); r.y = n.getFullYear(); r.m = n.getMonth(); r.sel = dayKey(n); drawAll(); });
      drawAll();
    },
  },

  /* ---- daily quote ---- */
  quote: {
    label: 'Daily quote', desc: 'A small push, changes every day.',
    icon: ICONS.quote, defW: 3, defH: 2, minW: 2, minH: 2,
    defData: () => ({}),
    QUOTES: [

      ["What stands in the way becomes the way.", "Marcus Aurelius"],

      ["Dripping water hollows out stone — not through force, but persistence.", "Ovid"],
      ["Take rest; a field that has rested gives a bountiful crop.", "Ovid"],

      ["Energy and persistence conquer all things.", "Benjamin Franklin"],

      ["Knowing is not enough; we must apply. Willing is not enough; we must do.", "Goethe"],
      ["What is not started today is never finished tomorrow.", "Goethe"],

      ["Every artist was first an amateur.", "Ralph Waldo Emerson"],
      ["Perseverance — the secret of all triumphs.", "Victor Hugo"],
      ["All things are difficult before they are easy.", "Thomas Fuller"],
      ["Do not wait to strike till the iron is hot; make it hot by striking.", "W. B. Yeats"],
      ["Do what you can, with what you have, where you are.", "Theodore Roosevelt"],
      ["Genius is one percent inspiration, ninety-nine percent perspiration.", "Thomas Edison"],
    ],
    render(body, w) {
      if (!w.run) w.run = { off: 0 };
      const day = Math.floor(Date.now() / 86400000);
      const paint = () => {
        const q = this.QUOTES[(day + w.run.off) % this.QUOTES.length];
        body.innerHTML = `
          <div class="qt">
            <div class="qt-text">“${q[0]}”</div>
            <div class="qt-by"><span>— ${q[1]}</span><button class="link">Another</button></div>
          </div>`;
        body.querySelector('button').addEventListener('click', () => { w.run.off++; paint(); });
      };
      paint();
    },

  /* ---- quick links ---- */
  links: {
    label: 'Quick links', desc: 'One-click shortcuts to your go-to sites.',
    icon: ICONS.links, defW: 4, defH: 3, minW: 2, minH: 2,
    defData: () => ({ items: [] }),
    render(body, w) {
      body.innerHTML = `
        <div class="lk">
          <div class="lk-list"></div>
          <div class="inline-add">
            <input type="text" class="grow lbl" placeholder="Name" maxlength="40" aria-label="Link name">
            <input type="text" class="grow url" placeholder="URL" maxlength="300" aria-label="Link URL">
            <button class="icon-btn" aria-label="Add link">${ICONS.plus}</button>
          </div>
        </div>`;
      const list = body.querySelector('.lk-list');
      const lblIn = body.querySelector('.lbl');
      const urlIn = body.querySelector('.url');
      const norm = u => /^https?:\/\//i.test(u) ? u : 'https://' + u;
      const draw = () => {
        list.innerHTML = '';
        if (!(w.data.items || []).length) list.appendChild(el('div', 'mini-empty', 'No links yet — add one below.'));
        const sorted = (w.data.items || []).slice().sort((a, b) =>
          (a.label || '').localeCompare(b.label || '', undefined, { sensitivity: 'base', numeric: true }));
        sorted.forEach((item) => {
          const row = el('div', 'li');
          row.setAttribute('role', 'link');
          row.tabIndex = 0;
          row.append(
            el('span', 'mono', (item.label || '?').slice(0, 1)),
            el('span', 'tx', item.label),
          );
          const arr = el('span', 'arr'); arr.innerHTML = ICONS.external; arr.querySelector('svg').style.width = '12px';
          row.appendChild(arr);
          const x = el('button', 'row-x'); x.innerHTML = ICONS.x; x.setAttribute('aria-label', 'Delete link');
          x.addEventListener('click', e => { e.stopPropagation(); confirmRowDelete('link', item.label, () => { const i = w.data.items.indexOf(item); if (i > -1) w.data.items.splice(i, 1); draw(); saveState(); }); });
          row.appendChild(x);
          const open = () => window.open(norm(item.url), '_blank', 'noopener');
          row.addEventListener('click', e => { if (!e.target.closest('.row-x')) open(); });
          row.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
          list.appendChild(row);
        });
      };
      const add = () => {
        const label = lblIn.value.trim(), url = urlIn.value.trim();
        if (!label || !url) return;
        w.data.items.push({ label, url });
        lblIn.value = ''; urlIn.value = '';
        draw(); saveState();
      };
      body.querySelector('.icon-btn').addEventListener('click', add);
      urlIn.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
      draw();
    },
  },
};
const TYPE_ORDER = ['clock', 'countdown', 'y2027', 'calendar', 'schedule', 'dailies', 'deadlines', 'todo', 'matrix', 'note', 'pomo', 'timer', 'links', 'quote'];

/* ================================================================
   SETTINGS MODAL
   ================================================================ */
let modalCleanup = null;
function openModal({ title, sub, body, actions }) {
  const scrim = $('#scrim'), box = $('#modalBox');
  box.innerHTML = '';
  box.appendChild(el('h3', null, title));
  if (sub) box.appendChild(el('div', 'sub', sub));
  if (body) box.appendChild(body);
  const act = el('div', 'modal-actions');
  actions.forEach(a => {
    const b = el('button', 'btn ' + (a.cls || 'ghost'), a.label);
    b.addEventListener('click', () => { closeModal(); if (a.fn) a.fn(); });
    act.appendChild(b);
  });
  box.appendChild(act);
  scrim.hidden = false;
  const esc = e => { if (e.key === 'Escape') closeModal(); };
  const bg = e => { if (e.target === scrim) closeModal(); };
  document.addEventListener('keydown', esc);
  scrim.addEventListener('pointerdown', bg);
  modalCleanup = () => { document.removeEventListener('keydown', esc); scrim.removeEventListener('pointerdown', bg); };
}
function closeModal() {
  $('#scrim').hidden = true;
  if (modalCleanup) { modalCleanup(); modalCleanup = null; }
}

function buildField(f) {
  const wrap = el('div', 'field' + (f.input === 'check' ? ' check' : ''));
  const id = 'f_' + f.key;
  if (f.input === 'check') {
    const inp = el('input'); inp.type = 'checkbox'; inp.id = id; inp.checked = !!f.value;
    const lab = el('label', null, f.label); lab.htmlFor = id;
    wrap.append(inp, lab);
    wrap._get = () => inp.checked;
  } else if (f.input === 'select') {
    const lab = el('label', null, f.label); lab.htmlFor = id;
    const sel = el('select'); sel.id = id;
    f.opts.forEach(o => { const op = el('option', null, o.t); op.value = o.v; sel.appendChild(op); });
    sel.value = f.value;
    wrap.append(lab, sel);
    wrap._get = () => f.map ? f.map(sel.value) : sel.value;
  } else {
    const lab = el('label', null, f.label); lab.htmlFor = id;
    const inp = el('input'); inp.type = f.input; inp.id = id; inp.value = f.value ?? '';
    if (f.min != null) inp.min = f.min;
    if (f.max != null) inp.max = f.max;
    if (f.input === 'text') inp.maxLength = 60;
    wrap.append(lab, inp);
    wrap._get = () => {
      if (f.input === 'number') {
        const n = parseInt(inp.value, 10);
        return isNaN(n) ? f.value : clamp(n, f.min ?? 1, f.max ?? 999);
      }
      return inp.value;
    };
  }
  wrap._key = f.key;
  return wrap;
}

function openSettings(w) {
  const t = TYPES[w.type];
  const fields = [
    { key: '__title', label: 'Widget title', input: 'text', value: w.title },
    ...(t.settings ? t.settings(w) : []),
  ];
  const holder = el('div');
  const nodes = fields.map(buildField);
  nodes.forEach(n => holder.appendChild(n));
  openModal({
    title: 'Widget settings',
    sub: t.label,
    body: holder,
    actions: [
      { label: 'Cancel', cls: 'ghost' },
      { label: 'Save changes', cls: 'primary', fn: () => {
          nodes.forEach(n => {
            const v = n._get();
            if (n._key === '__title') w.title = String(v).trim() || t.label;
            else if (n._key === 'target' && !v) return;   // keep the old date if cleared
            else w.data[n._key] = v;
          });
          refreshWidget(w);
          saveState();
        } },
    ],
  });
  setTimeout(() => { const f = holder.querySelector('input,select'); if (f) f.focus(); }, 30);
}

/* ================================================================
   TRAY / MODE / INIT
   ================================================================ */
function buildTray() {
  const holder = $('#trayCards');
  TYPE_ORDER.forEach(k => {
    const t = TYPES[k];
    const c = el('button', 'tcard');
    c.innerHTML = `<span class="ti">${t.icon}</span><span class="tt"><b>${t.label}</b><span>${t.desc}</span><i>${t.defW}×${t.defH} on the grid</i></span>`;
    c.addEventListener('click', () => addWidget(k));
    holder.appendChild(c);
  });
}

function setMode(m) {
  if (m === 'edit' && window.matchMedia('(max-width:720px)').matches) m = 'view';
  mode = m;
  document.body.dataset.mode = m;
  $('#modeBtn').innerHTML = m === 'edit'
    ? `${ICONS.check}<span>Done</span>`
    : `${ICONS.gear}<span>Customize</span>`;
  $('#tray').hidden = m !== 'edit';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('#emptyState').hidden = state.widgets.length > 0 || m === 'edit';
  setCanvasHeight();
}

/* dashboard title */
const titleInput = $('#dashTitle');
function applyTitle() {
  titleInput.value = state.title || 'My Dashboard';
  document.title = state.title || 'Student Dashboard';
}

/* ---------- boot ---------- */
state = loadState() || defaultState();
applyTitle();
buildTray();
renderAll();
setMode('view');

titleInput.addEventListener('input', () => {
  state.title = titleInput.value;
  document.title = titleInput.value || 'Student Dashboard';
  saveState();
});
titleInput.addEventListener('keydown', e => { if (e.key === 'Enter') titleInput.blur(); });

const confirmToggle = $('#confirmToggle');
confirmToggle.checked = state.confirmDeletes !== false;
confirmToggle.addEventListener('change', () => { state.confirmDeletes = confirmToggle.checked; saveState(); });

$('#modeBtn').addEventListener('click', () => setMode(mode === 'edit' ? 'view' : 'edit'));
$('#themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  store.set(THEME_KEY, next);
});
$('#emptyBtn').addEventListener('click', () => setMode('edit'));
$('#resetBtn').addEventListener('click', () => openModal({
  title: 'Reset dashboard?',
  sub: 'This replaces your current layout and content with the default example.',
  actions: [
    { label: 'Cancel', cls: 'ghost' },
    { label: 'Reset', cls: 'danger', fn: () => { state = defaultState(); applyTitle(); confirmToggle.checked = state.confirmDeletes !== false; renderAll(); saveState(); } },
  ],
}));

/* backup: export & import */
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = el('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.title || 'dashboard').trim().replace(/\s+/g, '-').toLowerCase() + '-backup.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let s = null;
    try {
      s = JSON.parse(reader.result);
      if (!s || !Array.isArray(s.widgets)) s = null;
    } catch (err) { s = null; }
    if (!s) {
      openModal({
        title: 'Couldn\u2019t import that file',
        sub: 'It doesn\u2019t look like a dashboard backup \u2014 export one from this panel first.',
        actions: [{ label: 'OK', cls: 'primary' }],
      });
      return;
    }
    s.widgets = s.widgets.filter(x => TYPES[x.type]);
    openModal({
      title: 'Import this backup?',
      sub: `This replaces your current dashboard with \u201c${s.title || 'My Dashboard'}\u201d (${s.widgets.length} widget${s.widgets.length === 1 ? '' : 's'}).`,
      actions: [
        { label: 'Cancel', cls: 'ghost' },
        { label: 'Import', cls: 'primary', fn: () => { state = s; applyTitle(); confirmToggle.checked = s.confirmDeletes !== false; renderAll(); saveState(); } },
      ],
    });
  };
  reader.readAsText(file);
});

/* today line + 1-second ticker for time widgets */
function paintToday(now) {
  $('#todayLine').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
paintToday(new Date());
let curDayKey = dayKey(new Date());
setInterval(() => {
  const now = new Date();
  if (dayKey(now) !== curDayKey) {                 // midnight rollover
    curDayKey = dayKey(now);
    state.widgets.forEach(w => {
      if (['dailies', 'schedule', 'calendar', 'deadlines', 'quote'].includes(w.type)) refreshWidget(w);
    });
  }
  paintToday(now);
  state.widgets.forEach(w => {
    const t = TYPES[w.type];
    if (!t.tick) return;
    const m = mounted.get(w.id);
    if (m) t.tick(m.body, w, now);
  });
}, 1000);

/* keep the grid snapped to the window */
let rafId = null;
window.addEventListener('resize', () => {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(layoutAll);
});
try {
  window.matchMedia('(max-width:720px)').addEventListener('change', e => {
    if (e.matches && mode === 'edit') setMode('view');
  });
} catch (e) { /* older browsers */ }
</script>
